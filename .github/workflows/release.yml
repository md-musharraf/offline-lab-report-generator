# Pushing a version tag (git tag v1.7.0 && git push origin v1.7.0) builds the installer, runs every test
# against it, and publishes it as a GitHub Release. Installed apps download it from there by themselves
# (electron-updater, see startAutoUpdates in main.js). A failing test publishes nothing.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Tag matches package.json version
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx electron-builder --publish never

      - name: E2E on the installed-app build
        run: npx playwright test
        env:
          E2E_PACKAGED: '1'

      - name: Publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "JharLab $GITHUB_REF_NAME" --generate-notes
          dist/JharLab-Setup-*.exe dist/JharLab-Setup-*.exe.blockmap dist/latest.yml
