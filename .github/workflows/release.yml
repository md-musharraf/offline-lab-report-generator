# Every push to main builds the installer and runs every test against it. Pushing a version tag
# (git tag v1.7.2 && git push origin v1.7.2) does the same and then publishes the installer as a GitHub Release,
# which installed apps download by themselves (electron-updater, see startAutoUpdates in main.js).
# A failing test publishes nothing.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.1 # the version releases are tested with locally
          cache: npm

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"

      - run: npm ci
      - run: npm run build

      - name: Unit tests
        shell: bash
        run: npm test 2>&1 | tee test-output.txt

      - run: npx electron-builder --publish never

      - name: E2E on the installed-app build
        shell: bash
        run: npx playwright test 2>&1 | tee test-output.txt
        env:
          E2E_PACKAGED: '1'

      # Logs need a GitHub sign-in; annotations do not. Put the failing tests where anyone can read them.
      - name: Show failing tests
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          grep -n -i -B3 -A30 -E "not ok|✖|✘|failed|Error" test-output.txt | head -c 60000 > failures.txt || true
          echo "::error title=Failing tests::$(sed -e 's/%/%25/g' -e 's/\r//g' failures.txt | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --title "JharLab $GITHUB_REF_NAME" --generate-notes
          dist/JharLab-Setup-*.exe dist/JharLab-Setup-*.exe.blockmap dist/latest.yml
